services:
  web:
    container_name: bnaasaas-mvp
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      BNAASAAS_DATA_FILE: /data/database.json
    volumes:
      - bnaasaas_data:/data
    restart: unless-stopped

volumes:
  bnaasaas_data:
